name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Freelancer connector dependencies
        run: python -m pip install -r connectors/freelancer/requirements.txt
      - name: Install Fiverr connector dependencies
        run: python -m pip install -r connectors/fiverr/requirements.txt
      - name: Behavioral tests
        run: npm test
      - name: Freelancer connector tests
        run: |
          pytest -q connectors/freelancer/tests
          python -m py_compile connectors/freelancer/freelancer_mcp_server.py
      - name: Fiverr connector tests
        run: |
          pytest -q connectors/fiverr/tests
          python -m py_compile connectors/fiverr/fiverr_mcp_server.py
      - name: Typecheck workspace
        run: npm run typecheck
      - name: Smoke verification
        run: npm run smoke
      - name: Buyer demo verification
        run: npm run demo
      - name: Build workspace
        run: npm run build
