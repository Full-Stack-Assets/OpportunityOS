name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Freelancer connector dependencies
        run: python -m pip install -r connectors/freelancer/requirements.txt
      - name: Preserve generated dependency lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Behavioral tests
        run: npm test
      - name: Freelancer connector tests
        run: |
          pytest -q connectors/freelancer/tests
          python -m py_compile connectors/freelancer/freelancer_mcp_server.py
      - name: Typecheck workspace
        run: npm run typecheck
      - name: Smoke verification
        run: npm run smoke
      - name: Build workspace
        run: npm run build
