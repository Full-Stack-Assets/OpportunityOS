name: Deploy OpportunityOS Control Plane to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "review/pages-baseline-2026-08"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build core package
        run: npm run build:core

      - name: Build OpportunityOS control plane
        env:
          GITHUB_ACTIONS: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          OPPORTUNITYOS_EXECUTION_MODE: simulation
        run: npm run build --workspace @opportunityos/control-plane

      - name: Verify exported control-plane artifact
        run: |
          test -f apps/control-plane/out/index.html
          grep -F "From Opportunity Discovery" apps/control-plane/out/index.html
          touch apps/control-plane/out/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload control-plane artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/control-plane/out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy OpportunityOS control plane
        id: deployment
        uses: actions/deploy-pages@v5
